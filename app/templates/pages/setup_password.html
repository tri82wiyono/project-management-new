<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atur Password · {{ brand.name }}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/login.css?v=22" />
</head>
<body>
  <div class="login-shell">
    <div class="login-bg" aria-hidden="true">
      <span class="login-orb login-orb-a"></span>
      <span class="login-orb login-orb-b"></span>
      <span class="login-orb login-orb-c"></span>
      <span class="login-wave login-wave-top"></span>
      <span class="login-wave login-wave-bottom"></span>
      <span class="login-grid"></span>
    </div>

    <main class="login-layout">
      <section class="login-brand-pane">
        <div class="brand-lockup">
          <span class="brand-mark" aria-hidden="true">
            <span class="cube cube-a"></span>
            <span class="cube cube-b"></span>
            <span class="cube cube-c"></span>
          </span>
          <div class="brand-text">
            <strong>PMS</strong>
            <span>{{ app_name }}</span>
          </div>
        </div>
        <div class="brand-hero-copy">
          <h1>
            <span class="accent-word">Atur</span> password baru
          </h1>
          <p>Masukkan password sementara dari email, lalu buat password baru sebelum masuk ke aplikasi.</p>
        </div>
      </section>

      <section class="login-form-pane">
        <div class="login-panel-inner">
          <form id="setup-password-form" class="login-card" novalidate>
            <div class="login-head">
              <h2 id="setup-title">Atur Password</h2>
              <p id="setup-account-label">Memuat akun…</p>
            </div>

            <input type="hidden" id="setup-token" value="{{ setup_token or '' }}" />
            <input type="hidden" id="setup-mode" value="welcome" />

            <label class="field field-icon">
              <span class="sr-only">Email</span>
              <span class="field-ico" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
                  <circle cx="12" cy="8" r="3.5"/>
                  <path d="M5 19.5c1.8-3.2 4.2-4.5 7-4.5s5.2 1.3 7 4.5" stroke-linecap="round"/>
                </svg>
              </span>
              <input id="setup-email" type="email" readonly autocomplete="username" placeholder="Email akun" />
            </label>

            <label class="field field-icon" id="setup-temp-wrap">
              <span class="sr-only">Password sementara</span>
              <span class="field-ico" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
                  <rect x="5" y="11" width="14" height="9" rx="2"/>
                  <path d="M8 11V8a4 4 0 0 1 8 0v3" stroke-linecap="round"/>
                </svg>
              </span>
              <input
                id="setup-temp-password"
                type="password"
                autocomplete="current-password"
                placeholder="Password sementara dari email"
              />
              <button type="button" class="field-toggle" data-toggle-password="setup-temp-password" aria-label="Tampilkan password">
                <svg class="ico-eye" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                  <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/>
                  <circle cx="12" cy="12" r="2.5"/>
                </svg>
                <svg class="ico-eye-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" hidden>
                  <path d="M3 3l18 18"/>
                  <path d="M10.6 10.6A2.5 2.5 0 0 0 12 14.5"/>
                  <path d="M6.7 6.8C4.2 8.2 2.5 10.5 2 12c0 0 3.5 6 10 6 1.7 0 3.2-.4 4.5-1"/>
                  <path d="M14.1 9.1C15.3 9.9 16 11 16 12.2c0 .3 0 .5-.1.8"/>
                  <path d="M17.4 17.2C19.7 15.8 21.3 13.5 22 12c0 0-3.5-6-10-6-1 .0-1.9.1-2.8.4"/>
                </svg>
              </button>
            </label>

            <label class="field field-icon">
              <span class="sr-only">Password baru</span>
              <span class="field-ico" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
                  <rect x="5" y="11" width="14" height="9" rx="2"/>
                  <path d="M8 11V8a4 4 0 0 1 8 0v3" stroke-linecap="round"/>
                </svg>
              </span>
              <input
                id="setup-new-password"
                type="password"
                required
                minlength="8"
                autocomplete="new-password"
                placeholder="Password baru (min. 8 karakter)"
              />
              <button type="button" class="field-toggle" data-toggle-password="setup-new-password" aria-label="Tampilkan password">
                <svg class="ico-eye" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                  <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/>
                  <circle cx="12" cy="12" r="2.5"/>
                </svg>
                <svg class="ico-eye-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" hidden>
                  <path d="M3 3l18 18"/>
                  <path d="M10.6 10.6A2.5 2.5 0 0 0 12 14.5"/>
                  <path d="M6.7 6.8C4.2 8.2 2.5 10.5 2 12c0 0 3.5 6 10 6 1.7 0 3.2-.4 4.5-1"/>
                  <path d="M14.1 9.1C15.3 9.9 16 11 16 12.2c0 .3 0 .5-.1.8"/>
                  <path d="M17.4 17.2C19.7 15.8 21.3 13.5 22 12c0 0-3.5-6-10-6-1 .0-1.9.1-2.8.4"/>
                </svg>
              </button>
            </label>

            <label class="field field-icon">
              <span class="sr-only">Konfirmasi password baru</span>
              <span class="field-ico" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
                  <rect x="5" y="11" width="14" height="9" rx="2"/>
                  <path d="M8 11V8a4 4 0 0 1 8 0v3" stroke-linecap="round"/>
                </svg>
              </span>
              <input
                id="setup-confirm-password"
                type="password"
                required
                minlength="8"
                autocomplete="new-password"
                placeholder="Ulangi password baru"
              />
              <button type="button" class="field-toggle" data-toggle-password="setup-confirm-password" aria-label="Tampilkan password">
                <svg class="ico-eye" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                  <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/>
                  <circle cx="12" cy="12" r="2.5"/>
                </svg>
                <svg class="ico-eye-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" hidden>
                  <path d="M3 3l18 18"/>
                  <path d="M10.6 10.6A2.5 2.5 0 0 0 12 14.5"/>
                  <path d="M6.7 6.8C4.2 8.2 2.5 10.5 2 12c0 0 3.5 6 10 6 1.7 0 3.2-.4 4.5-1"/>
                  <path d="M14.1 9.1C15.3 9.9 16 11 16 12.2c0 .3 0 .5-.1.8"/>
                  <path d="M17.4 17.2C19.7 15.8 21.3 13.5 22 12c0 0-3.5-6-10-6-1 .0-1.9.1-2.8.4"/>
                </svg>
              </button>
            </label>

            <button type="submit" class="btn-login" id="btn-setup-save">
              <span>Simpan Password</span>
            </button>

            <p class="login-status" id="setup-status" aria-live="polite"></p>
            <a class="link-btn login-mfa-back" href="/login">Kembali ke login</a>
          </form>

          <p class="login-foot">{{ organization_name }} · {{ footer_note }}</p>
        </div>
      </section>
    </main>
  </div>
  <script src="/static/js/setup-password.js?v=2" defer></script>
</body>
</html>
