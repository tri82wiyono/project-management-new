<div class="modal-backdrop pm-confirm-backdrop" id="pm-confirm-modal" hidden>
  <div class="modal-card pm-confirm-card" role="dialog" aria-modal="true" aria-labelledby="pm-confirm-title">
    <div class="pm-confirm-icon" id="pm-confirm-icon" aria-hidden="true">?</div>
    <div class="pm-confirm-body">
      <h3 id="pm-confirm-title">Konfirmasi</h3>
      <p id="pm-confirm-message">Apakah Anda yakin?</p>
      <div class="pm-confirm-meta" id="pm-confirm-meta" hidden></div>
    </div>
    <div class="modal-actions pm-confirm-actions">
      <button type="button" class="btn btn-ghost" id="pm-confirm-cancel">Batal</button>
      <button type="button" class="btn btn-primary" id="pm-confirm-ok">Lanjutkan</button>
    </div>
  </div>
</div>
