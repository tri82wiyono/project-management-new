{% from "macros/nav_icons.html" import nav_icon %}
<aside class="sidebar" id="app-sidebar" aria-label="Primary navigation">
  <div class="brand">
    <div class="brand-mark" title="{{ brand.name }}">{{ brand.mark }}</div>
    <div class="brand-copy">
      <strong>{{ brand.name }}</strong>
      <span>{{ brand.tagline }}</span>
    </div>
    <button
      type="button"
      class="sidebar-edge-toggle"
      data-sidebar-toggle="edge"
      aria-label="Ciutkan sidebar"
      title="Ciutkan sidebar (Ctrl/⌘+B)"
    >
      <span data-sidebar-icon aria-hidden="true">‹</span>
    </button>
  </div>

  <nav class="nav" id="sidebar-nav" data-nav-root>
    {% for item in nav_items %}
      <a
        class="nav-item{% if item.key == active_page %} active{% endif %}"
        href="{{ item.href }}"
        data-section="{{ item.key }}"
        title="{{ item.label }}"
      >
        <span class="icon" aria-hidden="true">{{ nav_icon(item.key) }}</span>
        <span class="nav-label">{{ item.label }}</span>
      </a>
    {% endfor %}
  </nav>
  <script>
    (function () {
      try {
        var uid = document.body && document.body.getAttribute("data-user-id");
        var key = uid ? "pm_nav_order_" + uid : "pm_nav_order";
        var raw = localStorage.getItem(key);
        if (!raw) return;
        var order = JSON.parse(raw);
        if (!Array.isArray(order) || !order.length) return;
        var nav = document.getElementById("sidebar-nav");
        if (!nav) return;
        var map = {};
        Array.prototype.forEach.call(nav.querySelectorAll(".nav-item[data-section]"), function (el) {
          map[el.getAttribute("data-section")] = el;
        });
        order.forEach(function (k) {
          if (map[k]) nav.appendChild(map[k]);
        });
      } catch (e) { /* ignore */ }
    })();
  </script>

  <div class="sidebar-foot">
    <p>{{ workspace.label }}</p>
    <strong>{{ workspace.name }}</strong>
  </div>
</aside>
