<div class="topbar-user-cluster">
  <div class="notif-menu" data-notif-menu>
    <button
      type="button"
      class="notif-trigger"
      data-notif-toggle
      aria-haspopup="menu"
      aria-expanded="false"
      aria-label="Notifikasi mention"
      title="Notifikasi mention"
    >
      <span class="notif-bell" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 17h5l-1.4-1.4A2 2 0 0 1 18 14.2V11a6 6 0 1 0-12 0v3.2c0 .5-.2 1-.6 1.4L4 17h5" />
          <path d="M9.5 17a2.5 2.5 0 0 0 5 0" />
        </svg>
      </span>
      <span class="notif-badge" data-notif-badge hidden>0</span>
    </button>

    <div class="notif-dropdown" data-notif-panel hidden role="menu" aria-label="Daftar notifikasi mention">
      <div class="notif-head">
        <strong>Notifikasi</strong>
        <button type="button" class="notif-mark-all" data-notif-mark-all>Tandai dibaca</button>
      </div>
      <div class="notif-list" data-notif-list>
        <div class="notif-empty">Memuat notifikasi…</div>
      </div>
    </div>
  </div>

  <div class="user-menu" data-user-menu>
    <button
      type="button"
      class="user-menu-trigger"
      data-user-menu-toggle
      aria-haspopup="menu"
      aria-expanded="false"
      aria-label="Menu akun {{ current_user.name }}"
      title="{{ current_user.name }} · {{ current_user.role }}"
    >
      <img
        class="avatar"
        src="{{ current_user.avatar_url }}"
        alt="{{ current_user.name }}"
      />
      <span class="user-menu-caret" aria-hidden="true">▾</span>
    </button>

    <div class="user-menu-dropdown" data-user-menu-panel hidden role="menu">
      <div class="user-menu-head">
        <img src="{{ current_user.avatar_url }}" alt="" />
        <div>
          <strong>{{ current_user.name }}</strong>
          <span>{{ current_user.role }}{% if current_user.email %} · {{ current_user.email }}{% endif %}</span>
        </div>
      </div>
      <a class="user-menu-item" role="menuitem" href="/account">
        <span aria-hidden="true">◎</span>
        Profil
      </a>
      <a class="user-menu-item" role="menuitem" href="/account/security">
        <span aria-hidden="true">✎</span>
        Keamanan
      </a>
      <a class="user-menu-item danger" role="menuitem" href="/logout">
        <span aria-hidden="true">⎋</span>
        Logout
      </a>
    </div>
  </div>
</div>
