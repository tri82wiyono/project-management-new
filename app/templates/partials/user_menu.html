<div class="user-menu" data-user-menu>
  <button
    type="button"
    class="user-menu-trigger"
    data-user-menu-toggle
    aria-haspopup="menu"
    aria-expanded="false"
    aria-label="Menu akun {{ current_user.name }}"
    title="{{ current_user.name }} · {{ current_user.role }}"
  >
    <img
      class="avatar"
      src="{{ current_user.avatar_url }}"
      alt="{{ current_user.name }}"
    />
    <span class="user-menu-caret" aria-hidden="true">▾</span>
  </button>

  <div class="user-menu-dropdown" data-user-menu-panel hidden role="menu">
    <div class="user-menu-head">
      <img src="{{ current_user.avatar_url }}" alt="" />
      <div>
        <strong>{{ current_user.name }}</strong>
        <span>{{ current_user.role }}{% if current_user.email %} · {{ current_user.email }}{% endif %}</span>
      </div>
    </div>
    <a class="user-menu-item" role="menuitem" href="/account">
      <span aria-hidden="true">◎</span>
      Profil
    </a>
    <a class="user-menu-item" role="menuitem" href="/account/security">
      <span aria-hidden="true">✎</span>
      Keamanan
    </a>
    <a class="user-menu-item danger" role="menuitem" href="/logout">
      <span aria-hidden="true">⎋</span>
      Logout
    </a>
  </div>
</div>
