name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR='${{ secrets.VPS_APP_DIR }}'
            APP_DIR="${APP_DIR:-/opt/project-management-new}"
            cd "$APP_DIR"

            echo "==> Fetch latest main"
            git fetch origin main
            git reset --hard origin/main

            echo "==> Rebuild app container"
            docker compose -f docker-compose.prod.yml up -d --build app

            echo "==> Health check"
            for i in 1 2 3 4 5 6; do
              if curl -fsS http://127.0.0.1:8891/api/health >/dev/null; then
                echo "health ok"
                exit 0
              fi
              sleep 5
            done
            echo "health check failed"
            docker compose -f docker-compose.prod.yml logs --tail 80 app
            exit 1
